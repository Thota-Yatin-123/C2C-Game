<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIT Vellore: Night Terror</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            cursor: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            background: radial-gradient(
                circle,
                transparent 40%,
                rgba(0, 0, 0, 0.95) 90%
            );
            z-index: 4;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff2222;
            text-shadow:
                0 0 10px #ff0000,
                2px 2px 4px #000;
            font-weight: bold;
            font-size: 20px;
            pointer-events: none;
            z-index: 5;
            letter-spacing: 1px;
        }

        #minimap-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 170px;
            height: 170px;
            background: rgba(5, 5, 10, 0.85);
            border: 2px solid #ff2222;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
            border-radius: 8px;
            z-index: 5;
        }

        #minimap {
            width: 100%;
            height: 100%;
            border-radius: 6px;
        }

        #objective {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            background: rgba(0, 0, 0, 0.9);
            padding: 12px 24px;
            border: 1px solid #ff2222;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
            border-radius: 5px;
            text-align: center;
            pointer-events: none;
            z-index: 5;
            font-size: 15px;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 6px #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }
#status-ui {
    position: absolute;
    top: 75px;
    left: 20px;
    color: #ffffff;
    text-shadow: 0 0 6px #000;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 1px;
    pointer-events: none;
    z-index: 5;
}

.status-item {
    margin-bottom: 12px;
}

.status-bar-container {
    width: 180px;
    height: 10px;
    margin-top: 6px;
    background: rgba(40, 40, 40, 0.8);
    border: 1px solid #888;
}

#sprint-bar,
#battery-bar {
    width: 100%;
    height: 100%;
    background: #ffffff;
    transition: width 0.05s linear;
}

    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

    <div id="canvas-container"></div>

    <div id="vignette"></div>

    <div id="crosshair"></div>

    <div id="ui">
        KEYS COLLECTED:
        <span id="key-count">0</span> / 3
    </div>

    <div id="status-ui">

    <div class="status-item">
        SPRINT
        <div class="status-bar-container">
            <div id="sprint-bar"></div>
        </div>
    </div>

    <div class="status-item">
        FLASHLIGHT
        <div class="status-bar-container">
            <div id="battery-bar"></div>
        </div>
    </div>

</div>

    <div id="minimap-container">
        <canvas id="minimap" width="170" height="170"></canvas>
    </div>

    <div id="objective">
    Search
    <span style="color:#ff8888">P Block</span>,
    <span style="color:#ff8888">Q Block</span> &
    <span style="color:#ff8888">N Block</span>
    for 3 Keys.
    Escape via Main Gate!
    <br>
    [SHIFT to Sprint] [F to Toggle Flashlight]
</div>

    <script>

        // =========================================================
        // GAME SETUP
        // =========================================================

        let scene, camera, renderer;

        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        let isSprinting = false;

        let flashlight;
        let flashlightOn = false;
        let flashlightGlow;
        let flashlightBattery = 100;

const FLASHLIGHT_DRAIN_RATE = 12;

        const MAX_SPRINT_TIME = 5.0;
        let sprintTime = MAX_SPRINT_TIME;

        let prevTime = performance.now();

        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        let pitchObject;
        let yawObject;

        let keysCollected = 0;
        const keysList = [];
        const buildingColliders = [];

        let mainGate;
        let ghost;
        let torchMesh;
        let ghostTexture;

        let gameOver = false;
        let ghostVisibleOnMinimap = true;
        let ghostMinimapTimer = 0;

        let minimapCanvas;
        let minimapCtx;

        const keyCountUI =
            document.getElementById('key-count');

        const sprintBar =
            document.getElementById('sprint-bar');

        const batteryBar =
    document.getElementById('battery-bar');

        // =========================================================
        // INITIALIZE IMMEDIATELY
        // =========================================================

        init();
        animate();


        // =========================================================
        // INITIALIZATION
        // =========================================================

        function init() {

            // -----------------------------------------------------
            // Scene
            // -----------------------------------------------------

            scene = new THREE.Scene();

            scene.background =
                new THREE.Color(0x020205);

            scene.fog =
                new THREE.FogExp2(
                    0x020205,
                    0.03
                );


            // -----------------------------------------------------
            // Camera
            // -----------------------------------------------------

            camera =
                new THREE.PerspectiveCamera(
                    75,
                    window.innerWidth /
                    window.innerHeight,
                    0.1,
                    1000
                );


            // -----------------------------------------------------
            // First Person Rig
            // -----------------------------------------------------

            pitchObject =
                new THREE.Object3D();

            pitchObject.add(camera);


            yawObject =
                new THREE.Object3D();

            yawObject.position.set(
                0,
                1.7,
                40
            );

            yawObject.add(pitchObject);

            scene.add(yawObject);


            // -----------------------------------------------------
            // Ambient Lighting
            // -----------------------------------------------------

            const ambientLight =
                new THREE.AmbientLight(
                    0x080a15,
                    0.8
                );

            scene.add(ambientLight);


            // -----------------------------------------------------
            // Flashlight
            // -----------------------------------------------------

            flashlight =
                new THREE.SpotLight(
                    0xfff0dd,
                    4.0,
                    60,
                    Math.PI / 4.5,
                    0.4,
                    1.2
                );

            flashlight.position.set(
                0,
                0,
                0
            );

            camera.add(flashlight);


            const flashlightTarget =
                new THREE.Object3D();

            flashlightTarget.position.set(
                0,
                0,
                -10
            );

            camera.add(flashlightTarget);

            flashlight.target =
                flashlightTarget;

            flashlight.visible = false;


            // -----------------------------------------------------
            // Player Torch
            // -----------------------------------------------------

            create3DTorch();


            // -----------------------------------------------------
            // Ground
            // -----------------------------------------------------

            const floorGeo =
                new THREE.PlaneGeometry(
                    350,
                    350
                );

            const floorMat =
                new THREE.MeshStandardMaterial({
                    color: 0x08080c,
                    roughness: 0.8,
                    metalness: 0.2
                });

            const floor =
                new THREE.Mesh(
                    floorGeo,
                    floorMat
                );

            floor.rotation.x =
                -Math.PI / 2;

            scene.add(floor);


            // -----------------------------------------------------
            // Minimap
            // -----------------------------------------------------

            minimapCanvas =
                document.getElementById(
                    'minimap'
                );

            minimapCtx =
                minimapCanvas.getContext(
                    '2d'
                );


            // -----------------------------------------------------
            // World
            // -----------------------------------------------------

            ghostTexture =
                createTerrifyingFaceTexture();

            createBuildings();

            createMainGate();

            createKeys();

            createScaryGhost();

            createEnvironmentDetails();


            // -----------------------------------------------------
            // Renderer
            // -----------------------------------------------------

            renderer =
                new THREE.WebGLRenderer({
                    antialias: true
                });

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

            renderer.setPixelRatio(
                window.devicePixelRatio
            );

            renderer.toneMapping =
                THREE.ACESFilmicToneMapping;

            renderer.toneMappingExposure =
                0.9;

            document
                .getElementById(
                    'canvas-container'
                )
                .appendChild(
                    renderer.domElement
                );


            // -----------------------------------------------------
            // Controls
            // -----------------------------------------------------

            document.addEventListener(
                'mousemove',
                onMouseMove
            );

            document.addEventListener(
                'keydown',
                onKeyDown
            );

            document.addEventListener(
                'keyup',
                onKeyUp
            );

            window.addEventListener(
                'resize',
                onWindowResize
            );
        }


        // =========================================================
        // 3D TORCH
        // =========================================================

        function create3DTorch() {

            torchMesh =
                new THREE.Group();


            const handleGeo =
                new THREE.CylinderGeometry(
                    0.035,
                    0.045,
                    0.65,
                    12
                );

            const handleMat =
                new THREE.MeshStandardMaterial({
                    color: 0x111111,
                    roughness: 0.4
                });

            const handle =
                new THREE.Mesh(
                    handleGeo,
                    handleMat
                );

            handle.rotation.x =
                Math.PI / 2;

            torchMesh.add(handle);


            const headGeo =
                new THREE.CylinderGeometry(
                    0.075,
                    0.045,
                    0.2,
                    12
                );

            const headMat =
                new THREE.MeshStandardMaterial({
                    color: 0x444444,
                    metalness: 0.9,
                    roughness: 0.2
                });

            const head =
                new THREE.Mesh(
                    headGeo,
                    headMat
                );

            head.rotation.x =
                Math.PI / 2;

            head.position.z =
                -0.32;

            torchMesh.add(head);


            const lensGeo =
                new THREE.SphereGeometry(
                    0.06,
                    12,
                    12
                );

            const lensMat =
                new THREE.MeshBasicMaterial({
                    color: 0xffffee
                });

            const lens =
                new THREE.Mesh(
                    lensGeo,
                    lensMat
                );

            lens.position.z =
                -0.4;

            torchMesh.add(lens);


            torchMesh.position.set(
                0.38,
                -0.28,
                -0.55
            );

            camera.add(torchMesh);

            const glowGeometry = new THREE.SphereGeometry(0.07, 12, 12);

const glowMaterial = new THREE.MeshBasicMaterial({
    color: 0xffff00
});

flashlightGlow = new THREE.Mesh(
    glowGeometry,
    glowMaterial
);

flashlightGlow.position.set(
    0,
    0,
    -0.42
);

torchMesh.add(flashlightGlow);

flashlightGlow.visible = false;
        }


        // =========================================================
        // GHOST FACE TEXTURE
        // =========================================================

        function createTerrifyingFaceTexture() {

            const canvas =
                document.createElement(
                    'canvas'
                );

            canvas.width = 512;
            canvas.height = 512;

            const ctx =
                canvas.getContext('2d');


            ctx.fillStyle =
                '#020202';

            ctx.fillRect(
                0,
                0,
                512,
                512
            );


            // Blood veins / cracks

            ctx.strokeStyle =
                '#330000';

            ctx.lineWidth = 3;

            for (
                let i = 0;
                i < 15;
                i++
            ) {

                ctx.beginPath();

                ctx.moveTo(
                    256,
                    256
                );

                ctx.lineTo(
                    Math.random() * 512,
                    Math.random() * 512
                );

                ctx.stroke();
            }


            // Red eyes

            ctx.fillStyle =
                '#ff0000';

            ctx.shadowColor =
                '#ff0000';

            ctx.shadowBlur = 30;

            ctx.beginPath();

            ctx.arc(
                150,
                180,
                45,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.beginPath();

            ctx.arc(
                362,
                180,
                45,
                0,
                Math.PI * 2
            );

            ctx.fill();


            // Yellow pupils

            ctx.fillStyle =
                '#ffff00';

            ctx.shadowBlur = 10;

            ctx.beginPath();

            ctx.arc(
                150,
                180,
                12,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.beginPath();

            ctx.arc(
                362,
                180,
                12,
                0,
                Math.PI * 2
            );

            ctx.fill();


            // Screaming jaw

            ctx.fillStyle =
                '#000000';

            ctx.shadowBlur = 0;

            ctx.beginPath();

            ctx.ellipse(
                256,
                350,
                75,
                110,
                0,
                0,
                Math.PI * 2
            );

            ctx.fill();


            // Teeth

            ctx.fillStyle =
                '#dddddd';

            for (
                let i = 0;
                i < 12;
                i++
            ) {

                ctx.beginPath();

                ctx.moveTo(
                    186 + (i * 12),
                    250
                );

                ctx.lineTo(
                    192 + (i * 12),
                    295
                );

                ctx.lineTo(
                    198 + (i * 12),
                    250
                );

                ctx.fill();


                ctx.beginPath();

                ctx.moveTo(
                    186 + (i * 12),
                    440
                );

                ctx.lineTo(
                    192 + (i * 12),
                    395
                );

                ctx.lineTo(
                    198 + (i * 12),
                    440
                );

                ctx.fill();
            }


            return new THREE.CanvasTexture(
                canvas
            );
        }


        // =========================================================
        // BUILDINGS
        // =========================================================

        function createBuildingMesh(
            width,
            height,
            depth,
            color,
            x,
            z,
            labelText
        ) {

            const group =
                new THREE.Group();


            // Main structure

            const geo =
                new THREE.BoxGeometry(
                    width,
                    height,
                    depth
                );

            const mat =
                new THREE.MeshStandardMaterial({
                    color: color,
                    roughness: 0.8,
                    metalness: 0.1
                });

            const mesh =
                new THREE.Mesh(
                    geo,
                    mat
                );

            mesh.position.y =
                height / 2;

            group.add(mesh);


            // Windows

            const winMat =
                new THREE.MeshBasicMaterial({
                    color: 0xff3300
                });

            for (
                let y = 4;
                y < height - 4;
                y += 6
            ) {

                for (
                    let xOff = -width / 2 + 4;
                    xOff < width / 2 - 4;
                    xOff += 6
                ) {

                    const winGeo =
                        new THREE.PlaneGeometry(
                            2,
                            3
                        );

                    const win =
                        new THREE.Mesh(
                            winGeo,
                            winMat
                        );

                    win.position.set(
                        xOff,
                        y,
                        depth / 2 + 0.1
                    );

                    group.add(win);
                }
            }


            // Signboard

            const canvas =
                document.createElement(
                    'canvas'
                );

            const ctx =
                canvas.getContext('2d');

            canvas.width = 512;
            canvas.height = 128;

            ctx.fillStyle =
                '#050508';

            ctx.fillRect(
                0,
                0,
                512,
                128
            );

            ctx.fillStyle =
                '#ff1111';

            ctx.font =
                'Bold 36px Courier New';

            ctx.shadowColor =
                '#ff0000';

            ctx.shadowBlur = 10;

            ctx.textAlign =
                'center';

            ctx.fillText(
                labelText,
                256,
                75
            );


            const texture =
                new THREE.CanvasTexture(
                    canvas
                );


            const labelGeo =
                new THREE.PlaneGeometry(
                    18,
                    4.5
                );


            const labelMat =
                new THREE.MeshBasicMaterial({
                    map: texture,
                    side: THREE.DoubleSide
                });


            const labelMesh =
                new THREE.Mesh(
                    labelGeo,
                    labelMat
                );


            labelMesh.position.set(
                0,
                height + 3,
                0
            );

            group.add(labelMesh);


            // Beacon

            const light =
                new THREE.PointLight(
                    0xff0000,
                    2.0,
                    25
                );

            light.position.set(
                0,
                height + 1,
                depth / 2 + 2
            );

            group.add(light);


            group.position.set(
    x,
    0,
    z
);

scene.add(group);

// Building collision box
const collider = new THREE.Box3();

collider.min.set(
    x - width / 2,
    0,
    z - depth / 2
);

collider.max.set(
    x + width / 2,
    height,
    z + depth / 2
);

buildingColliders.push(collider);
        }


        function createBuildings() {

            createBuildingMesh(
                32,
                28,
                28,
                0x1f1525,
                -65,
                -60,
                "P BLOCK HOSTEL"
            );


            createBuildingMesh(
                32,
                28,
                28,
                0x121b24,
                65,
                -60,
                "Q BLOCK HOSTEL"
            );


            createBuildingMesh(
                38,
                28,
                28,
                0x16221f,
                0,
                -115,
                "N BLOCK HOSTEL"
            );
        }


        // =========================================================
        // MAIN GATE
        // =========================================================

        function createMainGate() {

            mainGate =
                new THREE.Group();


            const pillarGeo =
                new THREE.BoxGeometry(
                    4,
                    14,
                    4
                );


            const pillarMat =
                new THREE.MeshStandardMaterial({
                    color: 0x1a1a1a
                });


            const leftPillar =
                new THREE.Mesh(
                    pillarGeo,
                    pillarMat
                );

            leftPillar.position.set(
                -11,
                7,
                0
            );


            const rightPillar =
                new THREE.Mesh(
                    pillarGeo,
                    pillarMat
                );

            rightPillar.position.set(
                11,
                7,
                0
            );


            const barGeo =
                new THREE.BoxGeometry(
                    20,
                    9,
                    0.5
                );


            const barMat =
                new THREE.MeshStandardMaterial({
                    color: 0x550000,
                    roughness: 0.2
                });


            const gateBars =
                new THREE.Mesh(
                    barGeo,
                    barMat
                );


            gateBars.position.set(
                0,
                5.5,
                0
            );


            const gateLight =
                new THREE.PointLight(
                    0x00ffcc,
                    1.5,
                    20
                );


            gateLight.position.set(
                0,
                12,
                0
            );


            mainGate.add(
                gateLight
            );

            mainGate.add(
                leftPillar
            );

            mainGate.add(
                rightPillar
            );

            mainGate.add(
                gateBars
            );


            mainGate.position.set(
                0,
                0,
                55
            );

            scene.add(mainGate);
        }


        // =========================================================
        // KEYS
        // =========================================================

        function createKeys() {

            const keyGeo =
                new THREE.TorusGeometry(
                    0.6,
                    0.15,
                    8,
                    16
                );


            const keyMat =
                new THREE.MeshBasicMaterial({
                    color: 0xffff00
                });


            const locations = [

                {
                    x: -65,
                    z: -42
                },

                {
                    x: 65,
                    z: -42
                },

                {
                    x: 0,
                    z: -96
                }

            ];


            locations.forEach(
                (pos) => {

                    const keyGroup =
                        new THREE.Group();


                    const key =
                        new THREE.Mesh(
                            keyGeo,
                            keyMat
                        );


                    keyGroup.add(
                        key
                    );


                    const keyLight =
                        new THREE.PointLight(
                            0xffff00,
                            2.5,
                            12
                        );


                    keyGroup.add(
                        keyLight
                    );


                    keyGroup.position.set(
                        pos.x,
                        1.3,
                        pos.z
                    );


                    scene.add(
                        keyGroup
                    );


                    keysList.push(
                        keyGroup
                    );
                }
            );
        }


        // =========================================================
        // GHOST
        // =========================================================

        function createScaryGhost() {

            ghost =
                new THREE.Group();


            // Head

            const headGeo =
                new THREE.BoxGeometry(
                    2.2,
                    2.6,
                    2.2
                );


            const headMat =
                new THREE.MeshBasicMaterial({
                    map: ghostTexture
                });


            const head =
                new THREE.Mesh(
                    headGeo,
                    headMat
                );


            head.position.y =
                3.5;


            ghost.add(
                head
            );


            // Body

            const bodyGeo =
                new THREE.ConeGeometry(
                    1.8,
                    5,
                    8
                );


            const bodyMat =
                new THREE.MeshStandardMaterial({
                    color: 0x030303,
                    roughness: 0.9,
                    wireframe: true
                });


            const body =
                new THREE.Mesh(
                    bodyGeo,
                    bodyMat
                );


            body.position.y =
                1.6;

            body.rotation.x =
                Math.PI;


            ghost.add(
                body
            );


            // Arms

            const armGeo =
                new THREE.BoxGeometry(
                    0.2,
                    3.2,
                    0.2
                );


            const armMat =
                new THREE.MeshBasicMaterial({
                    color: 0x080808
                });


            const leftArm =
                new THREE.Mesh(
                    armGeo,
                    armMat
                );


            leftArm.position.set(
                -1.4,
                2.2,
                0.6
            );


            leftArm.rotation.x =
                -Math.PI / 3.5;


            const rightArm =
                new THREE.Mesh(
                    armGeo,
                    armMat
                );


            rightArm.position.set(
                1.4,
                2.2,
                0.6
            );


            rightArm.rotation.x =
                -Math.PI / 3.5;


            ghost.add(
                leftArm
            );

            ghost.add(
                rightArm
            );


            // Aura

            const ghostLight =
                new THREE.PointLight(
                    0xff0000,
                    3.0,
                    18
                );


            ghostLight.position.y =
                3.0;


            ghost.add(
                ghostLight
            );


            ghost.position.set(
                0,
                0,
                -50
            );


            scene.add(
                ghost
            );
        }


        // =========================================================
        // ENVIRONMENT
        // =========================================================

        function createEnvironmentDetails() {

            const lampPositions = [

                {
                    x: -25,
                    z: 10
                },

                {
                    x: 25,
                    z: 10
                },

                {
                    x: -25,
                    z: -30
                },

                {
                    x: 25,
                    z: -30
                },

                {
                    x: -25,
                    z: -80
                },

                {
                    x: 25,
                    z: -80
                }

            ];


            lampPositions.forEach(
                pos => {

                    const pole =
                        new THREE.Mesh(
                            new THREE.CylinderGeometry(
                                0.2,
                                0.2,
                                8
                            ),

                            new THREE.MeshStandardMaterial({
                                color: 0x111111
                            })
                        );


                    pole.position.set(
                        pos.x,
                        4,
                        pos.z
                    );


                    const bulb =
                        new THREE.PointLight(
                            0xffaa33,
                            0.8,
                            18
                        );


                    bulb.position.set(
                        pos.x,
                        7.8,
                        pos.z
                    );


                    scene.add(
                        pole
                    );

                    scene.add(
                        bulb
                    );
                }
            );
        }


        // =========================================================
        // MINIMAP
        // =========================================================

        function drawMinimap() {

            minimapCtx.clearRect(
                0,
                0,
                170,
                170
            );


            const scale = 0.48;

            const mapCenterX = 85;
            const mapCenterY = 85;


            const px =
                yawObject.position.x;

            const pz =
                yawObject.position.z;


            // Buildings

            minimapCtx.fillStyle =
                '#223344';


            minimapCtx.fillRect(
                mapCenterX +
                (-65 - px) * scale - 8,

                mapCenterY +
                (-60 - pz) * scale - 7,

                16,
                14
            );


            minimapCtx.fillRect(
                mapCenterX +
                (65 - px) * scale - 8,

                mapCenterY +
                (-60 - pz) * scale - 7,

                16,
                14
            );


            minimapCtx.fillRect(
                mapCenterX +
                (0 - px) * scale - 9,

                mapCenterY +
                (-115 - pz) * scale - 7,

                18,
                14
            );


            // Main Gate

            minimapCtx.fillStyle =
                '#00ffcc';


            minimapCtx.fillRect(
                mapCenterX +
                (0 - px) * scale - 8,

                mapCenterY +
                (55 - pz) * scale - 2,

                16,
                4
            );


            // Keys

            minimapCtx.fillStyle =
                '#ffff00';


            keysList.forEach(
                key => {

                    if (
                        key.visible
                    ) {

                        const kx =
                            mapCenterX +
                            (
                                key.position.x -
                                px
                            ) * scale;


                        const ky =
                            mapCenterY +
                            (
                                key.position.z -
                                pz
                            ) * scale;


                        minimapCtx.beginPath();

                        minimapCtx.arc(
                            kx,
                            ky,
                            3.5,
                            0,
                            Math.PI * 2
                        );

                        minimapCtx.fill();
                    }
                }
            );


            // Ghost
// Ghost

if (ghostVisibleOnMinimap) {

    minimapCtx.fillStyle =
        (
            Math.floor(
                Date.now() / 200
            ) % 2 === 0
        )
            ? '#ff0000'
            : '#660000';


    const gx =
        mapCenterX +
        (
            ghost.position.x -
            px
        ) * scale;


    const gy =
        mapCenterY +
        (
            ghost.position.z -
            pz
        ) * scale;


    minimapCtx.beginPath();

    minimapCtx.arc(
        gx,
        gy,
        4.5,
        0,
        Math.PI * 2
    );

    minimapCtx.fill();
}


            // Player

            minimapCtx.fillStyle =
                '#ffffff';


            minimapCtx.beginPath();

            minimapCtx.arc(
                mapCenterX,
                mapCenterY,
                3.5,
                0,
                Math.PI * 2
            );

            minimapCtx.fill();
        }


        // =========================================================
        // MOUSE LOOK
        // =========================================================

        function onMouseMove(event) {

            if (gameOver) {
                return;
            }


            const movementX =
                event.movementX ||
                event.mozMovementX ||
                event.webkitMovementX ||
                0;


            const movementY =
                event.movementY ||
                event.mozMovementY ||
                event.webkitMovementY ||
                0;


            yawObject.rotation.y -=
                movementX * 0.0025;


            pitchObject.rotation.x -=
                movementY * 0.0025;


            pitchObject.rotation.x =
                Math.max(
                    -Math.PI / 2.5,
                    Math.min(
                        Math.PI / 2.5,
                        pitchObject.rotation.x
                    )
                );
        }


        // =========================================================
        // KEYBOARD INPUT
        // =========================================================

        function onKeyDown(event) {

            switch (event.code) {

                case 'KeyW':
                case 'ArrowUp':
                    moveForward = true;
                    break;


                case 'KeyA':
                case 'ArrowLeft':
                    moveLeft = true;
                    break;


                case 'KeyS':
                case 'ArrowDown':
                    moveBackward = true;
                    break;


                case 'KeyD':
                case 'ArrowRight':
                    moveRight = true;
                    break;


                case 'ShiftLeft':
                case 'ShiftRight':
                    isSprinting = true;
                    break;

                case 'KeyF':

    if (
        flashlightBattery > 0
    ) {

        flashlightOn =
            !flashlightOn;

        flashlight.visible =
            flashlightOn;

        if (flashlightGlow) {
            flashlightGlow.visible =
                flashlightOn;
        }
    }

    break;
            }
        }


        function onKeyUp(event) {

            switch (event.code) {

                case 'KeyW':
                case 'ArrowUp':
                    moveForward = false;
                    break;


                case 'KeyA':
                case 'ArrowLeft':
                    moveLeft = false;
                    break;


                case 'KeyS':
                case 'ArrowDown':
                    moveBackward = false;
                    break;


                case 'KeyD':
                case 'ArrowRight':
                    moveRight = false;
                    break;


                case 'ShiftLeft':
                case 'ShiftRight':
                    isSprinting = false;
                    break;
            }
        }


        // =========================================================
        // WINDOW RESIZE
        // =========================================================

        function onWindowResize() {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        }

        function canMoveTo(x, z) {

    const playerRadius = 0.8;

    const playerBox = new THREE.Box3(
        new THREE.Vector3(
            x - playerRadius,
            0,
            z - playerRadius
        ),
        new THREE.Vector3(
            x + playerRadius,
            2,
            z + playerRadius
        )
    );

    for (const collider of buildingColliders) {

        if (playerBox.intersectsBox(collider)) {
            return false;
        }
    }

    return true;
}



        // =========================================================
        // GAME LOOP
        // =========================================================

        function animate() {

            

            requestAnimationFrame(
                animate
            );


            const time =
                performance.now();


            const delta =
                (time - prevTime) /
                1000;


            prevTime = time;


            if (!gameOver) {

                // -------------------------------------------------
// Flashlight Battery
// -------------------------------------------------

if (
    flashlightOn &&
    flashlightBattery > 0
) {

    flashlightBattery -=
        FLASHLIGHT_DRAIN_RATE *
        delta;

    if (
        flashlightBattery <= 0
    ) {

        flashlightBattery = 0;

        flashlightOn = false;

        flashlight.visible = false;
        if (flashlightGlow) {
    flashlightGlow.visible = false;
}
    }
}
batteryBar.style.width =
    `${flashlightBattery}%`;
              

// -------------------------------------------------
// Movement
// -------------------------------------------------

const isMoving =
    moveForward ||
    moveBackward ||
    moveLeft ||
    moveRight;


// -------------------------------------------------
// Sprint
// -------------------------------------------------

if (
    isSprinting &&
    isMoving &&
    sprintTime > 0
) {

    sprintTime -= delta;

    if (sprintTime <= 0) {
        sprintTime = 0;
        isSprinting = false;
    }
}


const baseSpeed =
    isSprinting && sprintTime > 0
        ? 8.0
        : 5.0;


// Update sprint bar

const sprintPercent =
    sprintTime / MAX_SPRINT_TIME;

sprintBar.style.width =
    `${sprintPercent * 100}%`;


// -------------------------------------------------
// Camera-relative movement
// -------------------------------------------------

let moveX = 0;
let moveZ = 0;


// Local movement

if (moveForward) {
    moveZ -= 1;
}

if (moveBackward) {
    moveZ += 1;
}

if (moveLeft) {
    moveX -= 1;
}

if (moveRight) {
    moveX += 1;
}


// Normalize diagonal movement

const moveLength =
    Math.sqrt(
        moveX * moveX +
        moveZ * moveZ
    );


if (moveLength > 0) {

    moveX /= moveLength;
    moveZ /= moveLength;


    // -------------------------------------------------
    // Convert local movement to world movement
    // based on camera yaw
    // -------------------------------------------------

    const forward =
        -moveZ;

    const strafe =
        moveX;

    const angle =
        yawObject.rotation.y;


    const worldX =
        forward *
            (-Math.sin(angle))
        +
        strafe *
            Math.cos(angle);


    const worldZ =
        forward *
            (-Math.cos(angle))
        +
        strafe *
            (-Math.sin(angle));


    const nextX =
        yawObject.position.x +
        worldX *
        baseSpeed *
        delta;


    const nextZ =
        yawObject.position.z +
        worldZ *
        baseSpeed *
        delta;


    // -------------------------------------------------
    // Collision check — X
    // -------------------------------------------------

    if (
        canMoveTo(
            nextX,
            yawObject.position.z
        )
    ) {

        yawObject.position.x =
            nextX;
    }


    // -------------------------------------------------
    // Collision check — Z
    // -------------------------------------------------

    if (
        canMoveTo(
            yawObject.position.x,
            nextZ
        )
    ) {

        yawObject.position.z =
            nextZ;
    }
}

                yawObject.position.y =
                    1.7;


                yawObject.position.x =
                    Math.max(
                        -140,
                        Math.min(
                            140,
                            yawObject.position.x
                        )
                    );


                yawObject.position.z =
                    Math.max(
                        -140,
                        Math.min(
                            140,
                            yawObject.position.z
                        )
                    );


                // -------------------------------------------------
                // Torch Sway
                // -------------------------------------------------

                if (
                    moveForward ||
                    moveBackward ||
                    moveLeft ||
                    moveRight
                ) {

                    const bobSpeed =
                        isSprinting
                            ? 18
                            : 12;


                    torchMesh.position.y =
                        -0.28 +
                        Math.sin(
                            time *
                            0.001 *
                            bobSpeed
                        ) *
                        0.025;


                    torchMesh.position.x =
                        0.38 +
                        Math.cos(
                            time *
                            0.001 *
                            (bobSpeed / 2)
                        ) *
                        0.02;
                }


                // -------------------------------------------------
                // Key Pickup
                // -------------------------------------------------

                keysList.forEach(
                    keyGroup => {

                        if (
                            !keyGroup.visible
                        ) {
                            return;
                        }


                        keyGroup.rotation.y +=
                            2.5 *
                            delta;


                        const dist =
                            yawObject.position
                                .distanceTo(
                                    keyGroup.position
                                );


                        if (
                            dist < 3.2
                        ) {

                            keyGroup.visible =
                                false;


                            keysCollected++;


                            keyCountUI.innerText =
                                keysCollected;


                            // -------------------------------------
                            // Tell Level 1 that all keys are found
                            // -------------------------------------

                            if (
                                keysCollected === 3
                            ) {

                                window.parent.postMessage(
                                    {
                                        type:
                                            'SAMOLE_KEYS_COLLECTED'
                                    },
                                    '*'
                                );
                            }
                        }
                    }
                );


                // -------------------------------------------------
                // Ghost AI
                // -------------------------------------------------

                const ghostSpeed =
                    4 +
                    (
                        keysCollected *
                        0.5
                    );


                const ghostDir =
                    new THREE.Vector3()
                        .subVectors(
                            yawObject.position,
                            ghost.position
                        );


                ghostDir.y = 0;

                ghostDir.normalize();


                ghost.position.add(
                    ghostDir.multiplyScalar(
                        ghostSpeed *
                        delta
                    )
                );


                ghost.position.y =
                    0.5 +
                    Math.sin(
                        time * 0.006
                    ) *
                    0.5;


                ghost.lookAt(
                    yawObject.position.x,
                    ghost.position.y,
                    yawObject.position.z
                );


                // -------------------------------------------------
                // Minimap
                // -------------------------------------------------

                // -------------------------------------------------
// Ghost Minimap Visibility
// -------------------------------------------------

ghostMinimapTimer -= delta;

if (ghostMinimapTimer <= 0) {

    ghostVisibleOnMinimap =
        !ghostVisibleOnMinimap;

    if (ghostVisibleOnMinimap) {

        // Ghost visible for 4–8 seconds
        ghostMinimapTimer =
            THREE.MathUtils.randFloat(
                4,
                8
            );

    } else {

        // Ghost hidden for 3–7 seconds
        ghostMinimapTimer =
            THREE.MathUtils.randFloat(
                3,
                7
            );
    }
}


// -------------------------------------------------
// Minimap
// -------------------------------------------------

drawMinimap();


                // -------------------------------------------------
                // Death
                // -------------------------------------------------

                const distToGhost =
                    yawObject.position
                        .distanceTo(
                            ghost.position
                        );


                if (
                    distToGhost < 2.2
                ) {

                    triggerGameOver(
                        false
                    );
                }


                // -------------------------------------------------
                // Escape
                // -------------------------------------------------

                const distToGate =
                    yawObject.position
                        .distanceTo(
                            mainGate.position
                        );


                if (
                    distToGate < 6.5 &&
                    keysCollected === 3
                ) {

                    triggerGameOver(
                        true
                    );
                }
            }


            renderer.render(
                scene,
                camera
            );
        }


        // =========================================================
        // GAME OVER / ESCAPE
        // =========================================================

        function triggerGameOver(won) {

            if (gameOver) {
                return;
            }


            gameOver = true;


            if (won) {

                // -----------------------------------------------
                // Return to Phaser Level 1
                // -----------------------------------------------

                window.parent.postMessage(
                    {
                        type:
                            'SAMOLE_ESCAPE'
                    },
                    '*'
                );

            } else {

                // -----------------------------------------------
                // Death -> Main Menu
                // -----------------------------------------------

                window.top.location.href =
                    'index.html';
            }
        }

    </script>
